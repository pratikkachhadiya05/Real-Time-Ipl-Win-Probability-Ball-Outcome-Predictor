<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Win Probability Predictor</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>  body { background: #0f1923; color: #e0e0e0;      font-family: 'Segoe UI', sans-serif; }</style>
<body>

<div class="page-header">
    <h1>🏏 IPL Win Probability Predictor</h1>
    <p>Real-time chase analysis powered by machine learning</p>
</div>

<div class="container mb-5" style="max-width: 700px;">
    <div class="card-dark">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Batting Team</label>
                <select class="form-select" id="batting_team" required>
                    <option value="" selected disabled>Select Batting Team…</option>
                    {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Bowling Team</label>
                <select class="form-select" id="bowling_team" required>
                    <option value="" selected disabled>Select Bowling Team…</option>
                    {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12">
                <label class="form-label">Host City</label>
                <select class="form-select" id="city" required>
                    <option value="" selected disabled>Select City…</option>
                    {% for city in cities %}
                    <option value="{{ city }}">{{ city }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Target</label>
                <input type="number" class="form-control" id="target" placeholder="e.g. 185" required min="1">
            </div>
            <div class="col-md-3">
                <label class="form-label">Current Score</label>
                <input type="number" class="form-control" id="score" placeholder="e.g. 105" required min="0">
            </div>
            <div class="col-md-3">
                <label class="form-label">Overs</label>
                <input type="text" class="form-control" id="overs" placeholder="e.g. 10.5" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Wickets Out</label>
                <input type="number" class="form-control" id="wickets" placeholder="e.g. 3" required min="0" max="10">
            </div>
        </div>

        <div class="mt-4">
            <button class="btn-predict" onclick="predictWin()">Predict Win Probability</button>
            <button class="btn-ball" onclick="goToBallPredictor()">⚡ Next Ball Predictor →</button>

        </div>

        <!-- Result -->
        <div id="result" class="result-box">
            <div class="win-meter">
                <div class="win-bat"  id="win-bat-bar"  style="width:50%"><span id="win-bat-pct">50%</span></div>
                <div class="win-bowl" id="win-bowl-bar"><span id="win-bowl-pct">50%</span></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:.82rem; color:#a0b4c5; margin-bottom:12px;">
                <span id="label-bat">Batting</span>
                <span id="label-bowl">Bowling</span>
            </div>
            <div class="team-prob" id="res-bat" style="color:#2ecc71;"></div>
            <div class="team-prob" id="res-bowl" style="color:#e74c3c;"></div>
        </div>
    </div>
</div>

<script>
// Store match data in localStorage and navigate to ball predictor page
function goToBallPredictor() {
    const data = {
        batting_team: document.getElementById('batting_team').value,
        bowling_team: document.getElementById('bowling_team').value,
        city: document.getElementById('city').value,
        target: document.getElementById('target').value,
        score: document.getElementById('score').value,
        overs: document.getElementById('overs').value,
        wickets: document.getElementById('wickets').value
    };

    localStorage.setItem("matchData", JSON.stringify(data));
    window.location.href = "/predict_ball";
}

async function predictWin() {
    const batting_team = document.getElementById('batting_team').value;
    const bowling_team = document.getElementById('bowling_team').value;
    const city         = document.getElementById('city').value;
    const target       = parseInt(document.getElementById('target').value, 10);
    const score        = parseInt(document.getElementById('score').value, 10);
    const overs        = parseFloat(document.getElementById('overs').value);
    const wickets      = parseInt(document.getElementById('wickets').value, 10);



    if (!batting_team || !bowling_team || !city || isNaN(target) || isNaN(score) || isNaN(overs) || isNaN(wickets)) {
        alert('Please fill in all fields.');
        return;
    }
    if (batting_team === bowling_team) {
        alert('Batting and Bowling teams cannot be the same!');
        return;
    }

    // locally data store 
    localStorage.setItem("matchData", JSON.stringify({
    batting_team: batting_team,
    bowling_team: bowling_team,
    city: city,
    target: target,
    score: score,
    overs: overs,
    wickets: wickets
    }));

    const resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';
    resultDiv.style.background = '#11202d';
    document.getElementById('res-bat').textContent  = 'Calculating…';
    document.getElementById('res-bowl').textContent = '';

    try {
        const response = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ batting_team, bowling_team, city, target, score, overs, wickets })
        });

        if (!response.ok) throw new Error('Server error ' + response.status);
        const result = await response.json();

        if (result.error) {
            document.getElementById('res-bat').textContent  = 'Error: ' + result.error;
            document.getElementById('res-bowl').textContent = '';
            return;
        }

        const bat  = parseFloat(result.batting_prob);
        const bowl = parseFloat(result.bowling_prob);

        document.getElementById('win-bat-bar').style.width  = bat + '%';
        document.getElementById('win-bat-pct').textContent  = bat.toFixed(1) + '%';
        document.getElementById('win-bowl-pct').textContent = bowl.toFixed(1) + '%';
        document.getElementById('label-bat').textContent    = batting_team;
        document.getElementById('label-bowl').textContent   = bowling_team;
        document.getElementById('res-bat').textContent      = batting_team  + ': ' + bat.toFixed(1)  + '%';
        document.getElementById('res-bowl').textContent     = bowling_team  + ': ' + bowl.toFixed(1) + '%';

    } catch (err) {
        document.getElementById('res-bat').textContent  = 'Failed to connect to server.';
        document.getElementById('res-bowl').textContent = '';
    }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
